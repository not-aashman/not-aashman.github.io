<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <title>404 | Aashman Singh Verma</title>
    <meta name="robots" content="noindex" />

    <!-- ΛV mark: white lambda, cyan V, black ground. Same as index.html. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='ui-monospace,monospace' font-size='38' font-weight='700'%3E%3Ctspan fill='%23ffffff'%3E%CE%9B%3C/tspan%3E%3Ctspan fill='%2320daff'%3EV%3C/tspan%3E%3C/text%3E%3C/svg%3E"
    />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Alata&family=JetBrains+Mono:wght@400;500;700&family=Reggae+One&display=swap"
      rel="stylesheet"
    />

    <!-- Deliberately standalone: this page loads no CDN scripts and no
         script.js. A 404 that depends on GSAP, Lenis or Three.js can fail the
         same way the main page could, and this is the page a reader lands on
         when something has already gone wrong. Shares style.css for the
         palette and type; everything specific to it is inline below. -->
    <link rel="stylesheet" href="./style.css?v=2026-11-13-1" />

    <style>
      .nf-wrap {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--space-3xl) 4rem;
        position: relative;
        overflow: hidden;
      }

      .nf-logo {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: var(--space-2xl);
      }

      .nf-logo .nl {
        color: var(--accent);
      }

      .nf-eyebrow {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--accent);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: var(--space-md);
      }

      .nf-code {
        font-family: var(--font-display);
        font-size: clamp(5rem, 22vw, 12rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35);
        margin-bottom: var(--space-md);
      }

      .nf-title {
        font-family: var(--font-display);
        font-size: clamp(1.4rem, 4vw, 2.4rem);
        line-height: 1.2;
        margin-bottom: var(--space-md);
      }

      .nf-body {
        color: var(--text-dim);
        line-height: 1.8;
        max-width: 44ch;
        margin: 0 auto var(--space-xl);
      }

      .nf-links {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-sm);
        justify-content: center;
      }

      .nf-jp {
        font-family: var(--font-jp);
        font-size: clamp(3rem, 12vw, 7rem);
        color: rgba(255, 255, 255, 0.025);
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        pointer-events: none;
        user-select: none;
      }

      @media (max-width: 768px) {
        .nf-wrap {
          padding: var(--space-2xl) 1.5rem;
        }
      }

      @media (max-width: 400px) {
        .nf-wrap {
          padding: var(--space-2xl) 1rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="nf-wrap">
      <div class="nf-logo">A<span class="nl">V</span></div>

      <p class="nf-eyebrow">Error // Signal Lost</p>
      <p class="nf-code" aria-hidden="true">404</p>

      <h1 class="nf-title">This page isn't here.</h1>

      <p class="nf-body">
        The link is broken, or the page moved. Nothing is wrong on your end.
        Head back and the rest of the site is where you left it.
      </p>

      <div class="nf-links">
        <a href="./" class="view-btn">Back to the portfolio</a>
        <a href="./#projects" class="view-btn">See the work</a>
        <a href="./#contact" class="view-btn">Get in touch</a>
      </div>

      <div class="nf-jp" aria-hidden="true">迷子</div>
    </main>
  </body>
</html>
